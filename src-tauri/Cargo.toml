[package]
name = "campaign-forge"
version = "0.4.0"
description = "A local-first desktop campaign manager for tabletop game masters"
authors = ["David Levey"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "campaign_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
imagesize = "0.15.0"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["sync", "net", "time", "macros"] }
mdns-sd = "0.21"
local-ip-address = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
pdf-extract = "0.12.1"
notify-debouncer-mini = "0.7.0"

# Desktop only. The Android build is for players at a table: no campaign
# folder to pick, nothing to update in place, no assistant and so no API
# key, and no credential store to keep one in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-http = "2.8.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
keyring = "4"

# Android: the device model, read from the system properties, names this
# phone in the GM's pairing list.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: PDF text extraction (src/pdf.rs) catches panics from
# malformed files so one bad book cannot take the whole app down.
panic = "unwind"
strip = true
