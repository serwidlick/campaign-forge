            var row = slots[String(l)];
            if (isObj(row) && num(row.max, 0) > 0) levels.push(String(l));
          }
          if (levels.length) {
            var spells = card(
              "Spell slots used",
              button(null, "Long rest: restore", function () {
                edit(function (s) {
                  levels.forEach(function (lv) {
                    s.spellcasting.slots[lv].used = 0;
                  });
                });
              }),
            );
            var rows = h("div", "rows");
            levels.forEach(function (lv) {
              var r = slots[lv];
              var max = num(r.max, 0);
              var used = clamp(num(r.used, 0), 0, max);
              var line = h("div");
              line.appendChild(h("span", "row-name", ordinal(lv)));
              line.appendChild(
                pips(
                  "",
                  used,
                  max,
                  function (v) {
                    edit(function (s) {
                      s.spellcasting.slots[lv].used = v;
                    });
                  },
                  "Level " + lv + " slot",
                ),
              );
              rows.appendChild(line);
            });
            spells.appendChild(rows);
            box.appendChild(spells);
          }

          // Inventory counts.
          if (sh.inventory.length) {
            var inv = card("Inventory");
            var items = h("div", "rows");
            sh.inventory.forEach(function (item, i) {
              if (!isObj(item)) return;
              var line = h("div");
              var name = h("div", "row-name", item.name || "Item");
              if (item.notes)
                name.appendChild(h("div", "row-note", item.notes));
              line.appendChild(name);
              line.appendChild(
                stepper(
                  "inventory." + (item.id || i),
                  0,
                  Infinity,
                  function () {
                    return Math.max(0, num(item.qty, 1));
                  },
                  function (v, repaint) {
                    edit(function (s) {
                      s.inventory[i].qty = v;
                    }, repaint);
                  },
                ),
              );
              items.appendChild(line);
            });
            inv.appendChild(items);
            box.appendChild(inv);
          }

          // Coins.
          var money = card("Coins");
          var coins = h("div", "coins");
          COINS.forEach(function (k) {
            var lab = h("label", null, k);
            var input = document.createElement("input");
            input.type = "number";
            input.inputMode = "numeric";
            input.min = "0";
            input.value = String(Math.max(0, num(sh.currency[k], 0)));
            input.setAttribute("data-key", "currency." + k);
            input.oninput = function () {
              var n = num(input.value, null);
              if (n === null) return;
              edit(function (s) {
                s.currency[k] = Math.max(0, n);
              }, false);
            };
            input.onblur = function () {
              input.value = String(Math.max(0, num(sh.currency[k], 0)));
            };
            lab.appendChild(input);
            coins.appendChild(lab);
          });
          money.appendChild(coins);
          box.appendChild(money);

          paintSaveState(box);
          restoreFocus(box, focused);
        }

        var saveStateTimer = null;

        /** `root` is the box while it is being built and not yet attached. */
        function paintSaveState(root) {
          var el = root
            ? root.querySelector(".save-state")
            : document.querySelector("#sheet .save-state");
          if (!el) return;
          el.innerHTML = "";
          el.classList.toggle("err", draft.failed);
          if (draft.failed) {
            el.appendChild(document.createTextNode(draft.error || "Not saved"));
            el.appendChild(button(null, "Retry", flushDraft));
          } else if (draft.saving || draft.dirty) {
            el.textContent = "Saving…";
          } else if (draft.savedAt) {
            el.textContent = "Saved";
            if (saveStateTimer) clearTimeout(saveStateTimer);
            saveStateTimer = setTimeout(function () {
              draft.savedAt = 0;
              if (!draft.saving && !draft.dirty && !draft.failed) {
                paintSaveState();
              }
            }, 2000);
          }
        }

        function scheduleSave() {
          if (draft.timer) clearTimeout(draft.timer);
          draft.timer = setTimeout(flushDraft, SAVE_DELAY_MS);
          paintSaveState();
        }

        /** Sends the draft now, as the app does after its own short pause. */
        function flushDraft(keepalive) {
          if (draft.timer) {
            clearTimeout(draft.timer);
            draft.timer = null;
          }
          if (!draft.dirty || !draft.id || !state.token) return;
          // One save at a time; the next goes once this one has answered.
          if (draft.saving) return;
          var id = draft.id;
          draft.dirty = false;
          draft.saving = true;
          draft.failed = false;
          paintSaveState();
          api("/api/elements/" + id + "/sheet", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(draft.sheet),
            keepalive: keepalive === true,
          })
            .then(function (r) {
              if (r.status === 403) throw new Error("DENIED");
              if (!r.ok) {
                return r.json().then(
                  function (b) {
                    throw new Error(
                      (b && b.error) || "The table answered " + r.status,
                    );
                  },
                  function () {
                    throw new Error("The table answered " + r.status);
                  },
                );
              }
              return r.json();
            })
            .then(function () {
              // The GM's copy comes back through the version loop and is
              // adopted at the next repaint; swapping the draft here would
              // leave the painted fields reading a stale object.
              if (draft.id !== id) return;
              draft.saving = false;
              draft.savedAt = Date.now();
              if (draft.dirty) flushDraft();
              else paintSaveState();
            })
            .catch(function (e) {
              if (draft.id !== id) return;
              draft.saving = false;
              if (e.message === "DENIED") {
                // Not ours after all: fall back to the read-only view.
                draft.denied[id] = true;
                draft.dirty = false;
                if (state.openId === id) openElement(id, true);
                return;
              }
              draft.dirty = true;
              draft.failed = true;
              draft.error =
                "Could not save: " +
                (e.message === "Failed to fetch" ? "lost the GM" : e.message);
              paintSaveState();
            });
        }

        // Switching apps or closing the tab sends whatever is still pending.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") flushDraft(true);
        });
        window.addEventListener("pagehide", function () {
          flushDraft(true);
        });

        function renderMap(el) {
          var wrap = document.createElement("div");
          wrap.className = "map";
          var scale = Math.min(1, (window.innerWidth - 34) / el.width);
          var inner = document.createElement("div");
          inner.style.position = "relative";
          var img = document.createElement("img");
          img.alt = "";
          assetUrl(el.image).then(function (u) {
            img.src = u;
          });
          inner.appendChild(img);
          var zoom = document.createElement("div");
          zoom.className = "zoom";
          var minus = document.createElement("button");
          minus.textContent = "−";
          var plus = document.createElement("button");
          plus.textContent = "+";
          zoom.appendChild(minus);
          zoom.appendChild(plus);
          wrap.appendChild(zoom);
          wrap.appendChild(inner);

          function layout() {
            img.style.width = el.width * scale + "px";
            img.style.height = el.height * scale + "px";
            inner.querySelectorAll(".pin, .pin-label").forEach(function (n) {
              n.remove();
            });
            (el.pins || []).forEach(function (pin) {
              var dot = document.createElement("span");
              dot.className = "pin";
              dot.style.left = pin.x * scale + "px";
              dot.style.top = pin.y * scale + "px";
              dot.style.background = pin.color || "#e69a57";
              var target = pin.element ? byId(pin.element) : null;
              var label = pin.label || (target && target.name) || "";
              if (target) {
                dot.onclick = function () {
                  openElement(target.id);
                };
              }
              inner.appendChild(dot);
              if (label) {
                var lb = document.createElement("span");
                lb.className = "pin-label";
                lb.style.left = pin.x * scale + "px";
                lb.style.top = pin.y * scale + "px";
                lb.textContent = label;
                inner.appendChild(lb);
              }
            });
          }
          minus.onclick = function () {
            scale = Math.max(0.1, scale / 1.4);
            layout();
          };
          plus.onclick = function () {
            scale = Math.min(4, scale * 1.4);
            layout();
          };
          layout();
          return wrap;
        }
      })();
    </script>
  </body>
</html>
