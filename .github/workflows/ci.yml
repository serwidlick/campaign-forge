name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [development, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-target:
    name: branch target
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check release PR source
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_BASE_REF" == master && ( "$GITHUB_HEAD_REF" != development || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ) ]]; then
            echo "::error::Target development for feature and fix PRs. Promote the repository's development branch to master for release."
            exit 1
          fi

  commitlint:
    name: commitlint${{ github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  frontend:
    name: typecheck + lint + build${{ github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  rust:
    name: cargo check + clippy (${{ matrix.os }})${{ github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --lib --locked --config .cargo/windows-tests.toml
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  audit:
    name: cargo audit${{ github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Allowed warnings are listed in src-tauri/.cargo/audit.toml; anything
      # else fails the job.
      - run: cargo audit --deny warnings
        working-directory: src-tauri
