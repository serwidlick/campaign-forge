# Builds installers for every desktop platform plus the Android player APK
# and attaches them to a GitHub release. Trigger by pushing a tag like `v0.2.0`, or by hand from the
# Actions tab. The release is published as soon as the installers are up, so
# the download page picks it up without a further step.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release comes from master
        run: |
          case "$GITHUB_REF" in
            refs/heads/master|refs/tags/v*) ;;
            *) echo "::error::Select master or a version tag on master to publish a release."; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Merge development into master before releasing this commit."
            exit 1
          fi

  build:
    needs: release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon only; Intel Macs are not supported
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # Sign and notarise the macOS build when the Apple secrets are set.
      # Without them the build still succeeds, just unsigned (Gatekeeper then
      # calls the app "damaged" until the quarantine flag is removed).
      - name: macOS signing secrets
        if: startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            echo "KEYCHAIN_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages the app's updater verifies. Without it
          # the build fails on purpose: an unsigned release could not update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Campaign Forge ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Installers for Windows, macOS and Linux.

            - **Windows:** run the `.exe` installer. It installs for the current user, no admin rights needed. Windows SmartScreen may warn because the build is not code-signed; choose *More info → Run anyway*.
            - **macOS (Apple Silicon):** open the `.dmg` and drag Campaign Forge to Applications. If macOS calls the app damaged, it is an unsigned build: run `xattr -cr "/Applications/Campaign Forge.app"` once and open it again.
            - **Linux:** the `.AppImage` runs anywhere (make it executable first); the `.deb` is for Debian and Ubuntu.
            - **Android (players only):** open the `.apk` on the phone and allow installing from that source when asked. It joins a table; it cannot host one.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # The Android player app, as one arm64 APK. It is uploaded to the release
  # the desktop jobs created, so it runs after them. Signed with the release
  # keystore when the ANDROID_KEYSTORE_* secrets are set (see README.md),
  # otherwise with a throwaway debug key: that APK installs, but a phone will
  # not upgrade from it to a later, properly signed one without a reinstall.
  android:
    needs: [release-source, build]
    if: ${{ !cancelled() && needs.release-source.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;${{ env.NDK_VERSION }} platform-tools

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > src-tauri/gen/android/keystore.properties

      - run: pnpm tauri android build --apk --target aarch64

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          tag="${tag:-v$version}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' | head -n 1)
          test -n "$apk" || { echo "no release APK found"; exit 1; }
          cp "$apk" "Campaign.Forge_${version}_arm64.apk"
          gh release upload "$tag" "Campaign.Forge_${version}_arm64.apk" --clobber
