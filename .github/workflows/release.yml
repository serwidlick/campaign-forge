# Builds installers for every desktop platform and attaches them to a
# GitHub release. Trigger by pushing a tag like `v0.2.0`, or by hand from the
# Actions tab. The release is published as soon as the installers are up, so
# the download page picks it up without a further step.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-13 # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Campaign Forge ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Installers for Windows, macOS and Linux.

            - **Windows:** run the `.exe` installer. It installs for the current user, no admin rights needed. Windows SmartScreen may warn because the build is not code-signed; choose *More info → Run anyway*.
            - **macOS:** open the `.dmg` and drag Campaign Forge to Applications. The first launch needs a right-click → *Open* because the app is not notarised.
            - **Linux:** the `.AppImage` runs anywhere (make it executable first); the `.deb` is for Debian and Ubuntu.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
